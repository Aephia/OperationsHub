<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aephia Industries - Ship Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/jpeg" href="../Images/channels4_profile.jpg">
</head>
<body>
    <header>
        <h1>🚀 Ship Explorer</h1>

        <nav class="navigation-tabs">
            <button class="nav-tab active" data-tab="explorer">🌍 Explorer</button>
            <button class="nav-tab" data-tab="analytics">📊 Analytics</button>
        </nav>

        <nav class="breadcrumb">
            <a href="../index.html">Home</a> > Ship Explorer
        </nav>
    </header>

    <main>
        <!-- Explorer Tab Content -->
        <div id="explorerTab" class="tab-content active">
            <div class="stats">
                <div class="stat-card">
                    <span class="stat-number" id="totalShips">0</span>
                    <span class="stat-label">Total Ships</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="selectedShips">0</span>
                    <span class="stat-label">Selected</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="uniqueManufacturers">0</span>
                    <span class="stat-label">Manufacturers</span>
                </div>
            </div>

            <div class="explorer-layout">
                <div class="ships-sidebar">
                    <h3>🚀 Ships</h3>
                    <div class="search-container">
                        <input type="text" id="searchInput" placeholder="Search ships...">
                    </div>
                    <div class="checkbox-container" id="shipCheckboxes">
                        <!-- Ship checkboxes will be populated here -->
                    </div>
                </div>

                <div class="comparison-main">
                    <div class="comparison-table-wrapper" id="comparisonTableWrapper">
                        <!-- Comparison table will be generated here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Analytics Tab Content -->
        <div id="analyticsTab" class="tab-content">
            <div class="analytics-header">
                <h2>📊 Ship Analytics</h2>
                <p>Analyze ship specifications, fleet costs, and resource efficiency</p>
            </div>

            <!-- Sub-tabs for different analytics -->
            <nav class="sub-navigation-tabs">
                <button class="sub-nav-tab active" data-subtab="basic">📈 Basic Analytics</button>
                <button class="sub-nav-tab" data-subtab="fleet">🚀 Fleet</button>
                <button class="sub-nav-tab" data-subtab="efficiency">📊 Efficiency</button>
            </nav>

            <!-- Basic Analytics Sub-tab -->
            <div id="basicAnalyticsSubtab" class="subtab-content active">
                <div class="analytics-sections" id="analyticsContent">
                    <!-- Analytics will be populated here -->
                </div>
            </div>

            <!-- Fleet Sub-tab -->
            <div id="fleetAnalyticsSubtab" class="subtab-content">
                <div id="fleetLoadingMessage" style="display: none;">
                    <p>🔄 Loading fleet analytics...</p>
                </div>
                <div id="fleetContent" class="analytics-sections">
                    <!-- Fleet content will be rendered here -->
                </div>
            </div>

            <!-- Efficiency Sub-tab -->
            <div id="efficiencyAnalyticsSubtab" class="subtab-content">
                <div id="efficiencyLoadingMessage" style="display: none;">
                    <p>🔄 Loading resource efficiency analytics...</p>
                </div>
                <div id="efficiencyContent" class="analytics-sections">
                    <!-- Efficiency content will be rendered here -->
                </div>
            </div>
        </div>
    </main>

    <script src="../Utils/DataLoader.js"></script>
    <script src="../Utils/CrossExplorerAnalytics.js"></script>
    <script src="config-calculator.js"></script>
    <script src="js/attribute-management.js"></script>
    <script src="js/attributes-panel.js"></script>
    <script src="js/component-management.js"></script>
    <script src="js/custom-ship-management.js"></script>
    <script src="js/recipe-lookup.js"></script>
    <script src="fleet-analytics.js"></script>
    <script src="resource-efficiency.js"></script>
    <script src="app.js"></script>
</body>
</html>
